[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl"
version = "0.5.0.dev0+marktune"
description = "verl FSDP/vLLM runtime with MarkTune CE and gradient rewards"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch==2.6.0", "transformers==4.51.3", "accelerate>=1.4,<2",
  "datasets>=2.19,<4", "pyarrow>=19", "pandas>=2,<3", "numpy>=1.24,<2",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "codetiming>=1.4",
  "dill>=0.3.8", "ray[default]>=2.43,<2.44", "tensordict==0.8.3",
  "torchdata==0.11.0", "peft>=0.15,<0.16", "einops>=0.8", "packaging>=24",
  "psutil", "filelock", "pyzmq", "safetensors", "pylatexenc",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verl*"]
namespaces = false

[tool.setuptools.package-data]
verl = ["version/version", "trainer/runtime_env.yaml", "trainer/config/*.yaml", "trainer/config/*/*.yaml"]
